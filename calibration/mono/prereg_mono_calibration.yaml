# Pre-registration: how reliable are period exclusions from a single transit?
#
# STATUS: version 1.1 APPROVED by Jon McBee on 2026-11-22, before any trial was scored.
# Version 1.0 (approved the same day, git commit 1cf764f) had six gaps found while the harness was
# built; changes_from_1_0 below lists them. The only real-data run before this approval was a timing
# pilot whose outcomes were discarded in memory.
# This file is frozen; its SHA-256 is in calibration/mono/APPROVALS.md and tests/test_prereg_mono.py
# checks it. A change needs a new version, a dated reason and Jon's approval; results under a
# changed version are labelled post-hoc.
version: 1.1
status: approved
approved_by: Jon McBee
approved_on: 2026-11-22
pipeline_commit: 7929f57 plus the split of search_sector into search_sector and sector_events
  (this branch; no threshold changed)
written: 2026-11-22
spec: docs/STRATEGY_living_alias_catalogue.md (section 5.2; section 6a item 1)

why: >
  arXiv 2611.03019 calibrated duotransit period resolution with 300 injections and left single
  transits "for future work". For a single transit the output is a set of excluded periods. Nobody,
  including this project, has measured how often that set wrongly contains the true period. Our own
  injections (2026-11-01) were added after detrending, so they miss depth lost to detrending.

questions:
  Q1: How often is the true period excluded (false exclusion), by reference-event SNR?
  Q2: When a repeat exists in the data, how often is it found, and how often is the period then wrong?
  Q3: How much of log-period space is correctly excluded, by SNR and number of sectors?

pipeline:
  code: salinas-second-transits/st2core.py and st2_pipeline.py at the commit recorded at approval
  epoch_rule: half3s (exclude only if box depth < 0.5 * depth0 - 3 sigma)
  clean_epoch: coverage >= 0.8 and >= 0.5 d from a gap
  light_curves: QLP where available, else TESS-SPOC, else own TESScut; one product per sector
  no_tuning: no threshold in the pipeline changes during or after this run

arm_A_confirmed_planets:
  sample: >
    ExoFOP TOIs dispositioned CP or KP, period 10 to 100 d, at least 3 transits in TESS data, not among
    the 83 stars of EPOCH_RULE_TEST_2026-11-01 (those tuned the rule), not in gaia_dr4/hosts_frozen.csv.
    Up to 120, drawn with numpy seed 20261122 after sorting by TOI, 40 per depth bin
    (500-2000, 2000-5000, 5000-25000 ppm); a bin with fewer than 40 uses all it has.
  A1_hidden: >
    One transit is the reference (the first clean one). Every other transit window of the planet is
    removed from the light curve (+-1.5 durations). The true period then falls only in gaps, so any
    exclusion of it is a false exclusion.
  A2_visible: >
    Same reference, nothing removed. The pipeline should find repeats and return the true period.

arm_B_injections:
  hosts: 150 stars from gaia_dr4/hosts_frozen.csv, seed 20261123, stratified by Tmag (<10, 10-12, >12)
  catalogued_events: masked (+-0.75 d around each catalogued time) before injection
  model: batman, quadratic limb darkening from Claret (2017) table 25 (ATLAS, solar metallicity,
    xi = 2 km/s, LSM) at the nearest grid point to the TIC Teff and to log g from the TIC mass and
    radius; injected BEFORE detrending
  draws_per_host: 4
  period: log-uniform 20 to 1000 d
  depth: log-uniform 500 to 20000 ppm
  impact_parameter: uniform 0 to 0.9
  duration: from the period, the TIC stellar density and the impact parameter (circular orbit)
  phase: uniform, redrawn until at least one transit falls in clean data; that transit is the reference
  all_transits_injected: every transit the period implies, not only the reference

metrics:
  false_exclusion_rate: share of trials where the true period is in the excluded set
  repeat_recovery_rate: share of trials with a second transit in clean data where it is detected
  wrong_period_rate: among trials the pipeline calls resolved or narrowed, share whose set lacks the truth
  log_period_excluded: fraction of ln P between 1 d and 1000 d excluded, truth excluded or not
  bins: reference SNR (<6, 6-8, 8-12, 12-20, >20); arm B also by depth and by cadence of the reference

pass_criteria:   # stated before the run; a failure is reported as a failure, not re-thresholded
  false_exclusion_rate: "<= 5% overall, and <= 5% in every SNR bin at or above 6 (95% upper bound reported);
    judged in arms A2 and B"
  wrong_period_rate: "<= 3% (arXiv 2611.03019 reports 2 of 76 for duotransits)"
  repeat_recovery_rate: reported, no threshold

outcomes:
  pass: false exclusion met in arms A2 and B; wrong period met in arms A1, A2 and B
  fail: either threshold missed; the failing bin, its rate and its count are reported
  incomplete: fewer than 60 arm-A stars or 400 arm-B trials finish; the reason is recorded

human_review:
  - Any arm-A star where the true period is excluded: is the catalogued ephemeris wrong, or the rule?
  - Whether a failure changes what the catalogue publishes below a given SNR.

definitions:   # added in 1.1
  excluded_set: >
    A period P is excluded if any epoch t_cat + k P (k != 0) is a clean epoch whose verdict from
    st2core.epoch_verdicts is 'excludes'. The true period is tested at its exact value. For
    log_period_excluded, periods are log-spaced from 1 to 1000 d with a step that moves the farthest
    epoch by a quarter duration, and epochs are looked up on a time grid of one eighth of a duration.
  resolved: a passing event exists and the alias table through t_cat and that event has exactly one
    alias 'allowed' or 'supported'
  narrowed: the same with more than one
  truth_in_set: abs(dt - n P_true) < half a duration for some n, and alias n is not 'excluded'
  t_cat: the true time of the reference transit plus Gaussian scatter of 15 min
  stars_without_tic_mass_or_radius: solar values, flagged
  reference_sector: also searched for repeats, except within one duration of the reference

changes_from_1_0:   # proposed in PROPOSED_v1.1.md, approved by Jon 2026-11-22 with the Claret table
  - 1. The single-transit excluded set is defined (st2core has no such function).
  - 2. False exclusion is judged in A2 and B. In A1 the true period has no data and cannot be excluded.
  - 3. 'resolved' and 'narrowed' are defined.
  - 4. Catalogued events are masked by +-0.75 d (the frozen list carries no durations).
  - 5. Limb darkening from the Claret (2017) table, downloaded 2026-11-22 from the Harvard VizieR
       mirror (the Strasbourg server did not answer); calibration/mono/data/.
  - 6. The catalogued time has a 15 min Gaussian error.

implementation_notes:   # decided by Claude while writing the drivers, before any trial was scored;
                        # not individually approved by Jon. Each is reported with the results.
  - Arm B 'stratified by Tmag' is read as 50 hosts per bin; arm A as 40 per depth bin (samples.py).
  - Arm A's true ephemeris is the TOI ephemeris refined on the star's own detrended data, as in the
    2026-11-01 test (s10_epoch_rule_test.refine_ephemeris).
  - Arm A's 'at least 3 transits in TESS data' is read as at least 3 transits in clean data.
  - Arm A stars with more than one TOI (35 of 120) are kept and flagged; rates are reported with and
    without them, because another planet's transits can pass as a repeat.
  - Stars cooler than 3500 K use the 3500 K coefficients, flagged.

open_items:
  - Settled. Runtime - the pilot gave about 10 s per star and 3 s per trial; no cut to the sample.
  - Settled. Light curves - cached for part of arm B only; the rest are fetched from MAST.
  - Settled. The hook - st2_pipeline.sector_events.
