# Pre-registration: Gaia DR4 sweep of long-period TESS candidate hosts
#
# STATUS: DRAFT - not approved. Jon approves before 2026-12-02; approval freezes this file and its
# hash is recorded in the commit that marks it approved. A later change needs a new version, a dated
# reason and Jon's approval; results under a changed version are labelled post-hoc.
version: 0.1-draft
written: 2026-11-22
release: Gaia DR4, archive opens 2026-12-02 12:00 CET
spec: docs/STRATEGY_living_alias_catalogue.md (sections 5.4 and 6a)

inputs:
  # sha256 is filled in by `shasum -a 256` at approval; the files are built by build_hosts.py
  candidates: gaia_dr4/candidates_frozen.csv   # 967 rows
  hosts: gaia_dr4/hosts_frozen.csv             # 906 stars
  dr3_baseline: gaia_dr4/results_dr3/report.csv
  not_included:
    - T16 Planet Hunt single transits (arXiv 2604.18579): overlap and prior work not yet checked
    - TSTPC and Planet Hunters TESS lists: owned by active groups; not in this repo

questions:
  Q1: Which hosts does DR4 flag as non-single (RUWE, non_single_star, RV variability, an NSS orbit)
      that DR3 did not, and which DR3 flags disappear?
  Q2: For duotransits (two catalogued times), is the gap a whole number of a DR4 orbital period?
  Q3: For candidates with a stated period, does a DR4 orbital period agree, directly or at 1/2 or 2x?
  Q4: Is any host in the DR4 exoplanet candidate table?
  # TIC 147035057 and TIC 159614322 epoch-RV fits (singles/TODO_gaia_dr4.md) are separate claims with
  # their own pre-registration; they are not covered here.

tables:
  - gaia_source
  - nss_two_body_orbit        # every solution per source is kept
  - gaia_exoplanet_candidates # name from ESA's provisional content page (2026-09-14)

thresholds:
  ruwe_max: 1.4
  # RV variability: rv_chisq_pvalue <= 0.01 and rv_renormalised_gof > 4 and rv_nb_transits >= 10
  # (Katz et al. 2023, defined for DR3; if DR4 documents a different cut, that is a version change)
  nsig: 3.0
  dt_err_d: 0.02            # assumed 1-sigma error of a catalogued transit-time gap, in days
  max_window: 0.5           # phase test is 'uninformative' if it would accept > 50% of all phases
  period_rel_floor: 0.001   # period agreement tolerance is at least 0.1% of the stated period
  harmonics: [0.5, 1.0, 2.0]

outcomes:
  companion_flag: any of ruwe_flag, nss_flag, rv_flag. A flag is a reason to look, not a verdict that
    the transit signal is stellar.
  period_from_gaia: phase_verdict or period_verdict is 'match'. The phase window is reported with
    it; it is the chance that an unrelated orbit would match.
  no_match: an NSS orbit exists and the test is informative but fails. The Gaia orbit is then a
    different companion, or the candidate period is wrong.
  uninformative: reported as such; never counted as a match or a non-match.
  incomplete: a table or a host could not be queried; the error is recorded.

human_review:
  - Any period_from_gaia with phase_window > 0.1.
  - Any host whose DR3 and DR4 source differ, or with id_method = positional.
  - Whether a flagged host changes what a note or an email says. Nothing is sent by an agent.

open_items:   # to settle from the DR4 documentation before approval or on release day
  - Do DR3 source_ids carry over to DR4, or is a neighbourhood table needed?
  - Column names of nss_two_body_orbit and gaia_exoplanet_candidates in DR4.
  - Whether DR4 publishes its own RV-variability criterion.
  - Catalogued timing errors are not carried per candidate; dt_err_d is a single assumed value.
